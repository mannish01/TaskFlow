services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  api:
    build: .
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/taskflow
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      COOKIE_SECURE: "false"
      CLIENT_ORIGIN: http://localhost:5000
    ports:
      - "5000:5000"
    depends_on:
      - mongo

volumes:
  mongo-data:
