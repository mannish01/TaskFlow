services:
  - type: web
    name: taskflow
    runtime: docker
    plan: free
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: CLIENT_ORIGIN
        value: "https://taskflow-lac5.onrender.com"
