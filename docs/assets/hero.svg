<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="TaskFlow brutalist terminal banner">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#0B0B0A" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" fill="#F1EDE3"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="46" fill="#0B0B0A"/>
  <text x="28" y="30" fill="#F1EDE3" font-family="monospace" font-size="15" font-weight="bold" letter-spacing="3">TASKFLOW :: BUILD 2026</text>
  <text x="1170" y="30" text-anchor="end" fill="#C8FF2E" font-family="monospace" font-size="15" font-weight="bold" letter-spacing="2">● SYSTEM ONLINE</text>
  <text x="40" y="175" fill="#0B0B0A" font-family="monospace" font-size="96" font-weight="bold" letter-spacing="-5">TASK</text>
  <rect x="306" y="96" width="58" height="84" fill="#C8FF2E"/>
  <text x="320" y="163" fill="#0B0B0A" font-family="monospace" font-size="96" font-weight="bold">/</text>
  <text x="382" y="175" fill="#0B0B0A" font-family="monospace" font-size="96" font-weight="bold" letter-spacing="-5">FLOW</text>
  <text x="42" y="228" fill="#0B0B0A" fill-opacity="0.72" font-family="monospace" font-size="16" font-weight="bold" letter-spacing="1">NO NOISE. NO DASHBOARDS FULL OF CHARTS. ONE QUEUE, ONE JOB AT A TIME.</text>
  <text x="42" y="276" fill="#0B0B0A" font-family="monospace" font-size="17" font-weight="bold">$ npm run dev</text>
  <rect x="40" y="294" width="1120" height="3" fill="#0B0B0A"/>
  <rect x="40" y="294" width="180" height="3" fill="#C8FF2E"/>
</svg>
